[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-context-gateway"
version = "0.1.0"
description = "Agent-agnostic OpenAI-compatible gateway that prunes tool schemas, spills oversized context and builds a self-maintaining graph memory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-context-gateway contributors" }]
keywords = [
  "llm",
  "gateway",
  "openai",
  "anthropic",
  "context-management",
  "agent",
  "proxy",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
agent-gateway = "src.gateway:main"
agent-sentinel = "src.sentinel:main"
agent-mock-upstream = "tests.mock_upstream:main"

[tool.setuptools]
packages = ["src", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]
